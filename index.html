<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Nest - WaaS Clothing Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function(){
            emailjs.init("YOUR_PUBLIC_KEY"); // আপনার EmailJS Public Key এখানে দিন
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 pb-20">

    <!-- Top Header / Search Bar (Daraz Style) -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
            <h1 id="brandName" class="text-xl font-extrabold tracking-wider text-rose-500 uppercase">Style Nest</h1>
            <div class="flex-1 max-w-md relative">
                <input type="text" id="searchInput" placeholder="Search for trendy streetwear, hoodies..." class="w-full bg-slate-800 border border-slate-700 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:border-rose-500">
                <span class="absolute right-3 top-2.5 text-slate-400">🔍</span>
            </div>
            <!-- Admin Toggle Button (Secret/Separate) -->
            <button onclick="toggleAdminModal()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-rose-400 font-semibold">Admin Panel</button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold tracking-tight">Featured Collection</h2>
            <span class="text-xs text-slate-400">Showing all products</span>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Dynamic Products will load here -->
        </div>
    </main>

    <!-- Daraz Style Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 z-50 px-4 py-2 flex justify-around items-center text-xs">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-rose-500 font-medium">
            <span class="text-lg">🏠</span>
            <span>Home</span>
        </button>
        <button onclick="openWhatsAppSupport()" class="flex flex-col items-center text-slate-400 hover:text-white">
            <span class="text-lg">💬</span>
            <span>Messages</span>
        </button>
        <button onclick="openCartModal()" class="flex flex-col items-center text-slate-400 hover:text-white relative">
            <span class="text-lg">🛒</span>
            <span>Cart</span>
            <span id="cartBadge" class="absolute -top-1 -right-2 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
        <button onclick="openUserAccountModal()" class="flex flex-col items-center text-slate-400 hover:text-white">
            <span class="text-lg">👤</span>
            <span>Account</span>
        </button>
    </nav>

    <!-- Checkout / Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="closeCartModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
            <h3 class="text-xl font-bold mb-4">Your Shopping Cart</h3>
            <div id="cartItemsList" class="space-y-3 max-h-48 overflow-y-auto mb-4 text-sm">
                <!-- Cart items -->
            </div>
            <div class="border-t border-slate-800 pt-3 mb-4 space-y-2">
                <div class="flex justify-between font-semibold">
                    <span>Total Items:</span>
                    <span id="modalCartCount">0</span>
                </div>
            </div>
            <!-- Checkout Form with Email Field -->
            <form id="checkoutForm" onsubmit="handleFinalCheckout(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Full Name</label>
                    <input type="text" id="custName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Email Address (For Confirmation)</label>
                    <input type="email" id="custEmail" required placeholder="example@gmail.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Phone Number</label>
                    <input type="tel" id="custPhone" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Shipping Address</label>
                    <textarea id="custAddress" required rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-rose-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-rose-600/30">Confirm Order & Notify</button>
            </form>
        </div>
    </div>

    <!-- Vendor Admin Panel Modal (Separate) -->
    <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
            <h3 class="text-xl font-bold mb-4 text-rose-500">Vendor Product Management</h3>
            <form onsubmit="addNewProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Product Name</label>
                    <input type="text" id="newProdName" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Price (BDT)</label>
                    <input type="number" id="newProdPrice" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Image URL</label>
                    <input type="url" id="newProdImg" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl">Add Product to Store</button>
            </form>
        </div>
    </div>

    <!-- User Account Modal -->
    <div id="userAccountModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 relative text-center">
            <button onclick="openUserAccountModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
            <div class="w-16 h-16 bg-rose-500/20 text-rose-500 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">👤</div>
            <h3 class="text-lg font-bold">My Account</h3>
            <p class="text-xs text-slate-400 mt-1">Welcome back, Valued Customer!</p>
            <div class="mt-4 bg-slate-800 p-3 rounded-xl text-left text-xs space-y-2">
                <div class="flex justify-between"><span>Saved Orders:</span> <span class="font-bold">0</span></div>
                <div class="flex justify-between"><span>Membership:</span> <span class="text-rose-400 font-bold">Standard</span></div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let products = [
            { id: 1, name: "Drop-shoulder Graphic Tee", price: 850, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" },
            { id: 2, name: "Oversized Streetwear Hoodie", price: 1650, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=500" }
        ];
        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md flex flex-col justify-between">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-40 object-cover">
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <div>
                            <h3 class="text-sm font-semibold truncate">${p.name}</h3>
                            <p class="text-rose-500 font-bold mt-1">৳${p.price}</p>
                        </div>
                        <button onclick="addToCart(${p.id})" class="mt-3 w-full bg-slate-800 hover:bg-rose-600 text-xs font-semibold py-2 rounded-xl transition-all">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            document.getElementById('cartBadge').innerText = cart.length;
            alert(`${product.name} added to cart!`); // শুধুমাত্র কার্টে যোগ হবে, কোনো ইমেল বা হোয়াটসঅ্যাপ মেসেজ যাবে না।
        }

        function openCartModal() {
            document.getElementById('cartModal').classList.remove('hidden');
            document.getElementById('modalCartCount').innerText = cart.length;
            document.getElementById('cartItemsList').innerHTML = cart.map(item => `
                <div class="flex justify-between items-center bg-slate-800 p-2 rounded-lg">
                    <span>${item.name}</span>
                    <span class="text-rose-400 font-bold">৳${item.price}</span>
                </div>
            `).join('') || '<p class="text-slate-500 text-center">Cart is empty</p>';
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.classList.toggle('hidden');
        }

        function openUserAccountModal() {
            const modal = document.getElementById('userAccountModal');
            modal.classList.toggle('hidden');
        }

        function addNewProduct(e) {
            e.preventDefault();
            const name = document.getElementById('newProdName').value;
            const price = Number(document.getElementById('newProdPrice').value);
            const image = document.getElementById('newProdImg').value;
            
            products.push({ id: Date.now(), name, price, image });
            renderProducts();
            toggleAdminModal();
            e.target.reset();
            alert("Product added successfully!");
        }

        function handleFinalCheckout(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const email = document.getElementById('custEmail').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const ownerPhone = "8801886759590"; // আপনার নম্বর

            // EmailJS Integration (Only on Confirm Order)
            const templateParams = {
                to_name: name,
                to_email: email,
                cust_phone: phone,
                cust_address: address,
                cart_count: cart.length
            };

            emailjs.send('service_ce4fpfe', 'template_py8f1yp', templateParams)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);
                }, function(error) {
                    console.log('FAILED...', error);
                });

            // WhatsApp Redirection
            const message = `Hello! I would like to confirm my order.%0A%0A*Customer Details:*%0A - Name: ${encodeURIComponent(name)}%0A - Email: ${encodeURIComponent(email)}%0A - Phone: ${encodeURIComponent(phone)}%0A - Address: ${encodeURIComponent(address)}%0A*Total Items in Cart:* ${cart.length}`;
            const whatsappURL = `https://wa.me/${ownerPhone}?text=${message}`;
            
            window.open(whatsappURL, '_blank');
            closeCartModal();
            cart = [];
            document.getElementById('cartBadge').innerText = '0';
            alert("Order confirmed! Confirmation email sent and WhatsApp ready.");
        }

        function openWhatsAppSupport() {
            window.open('https://wa.me/8801886759590?text=Hello%20Style%20Nest,%20I%20need%20support!', '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
